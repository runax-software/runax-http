name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Detects whether the change touches anything beyond docs, so docs-only changes
  # skip the build and test jobs. Skipping must happen at the job level (not via
  # workflow paths filters): the required checks would otherwise never report on
  # docs-only PRs and block merging, whereas skipped jobs count as passing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.gitattributes'

  build-and-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup and build
        uses: ./.github/actions/setup-dotnet-build
        with:
          warnings-as-errors: "true"

      # No --framework, so this runs every test assembly the projects produce: net8.0, net9.0
      # and net10.0. The runtimes for all three come from the SDKs the setup action installs.
      # Unlike a broker-backed library, nothing here needs a container: the transport
      # conformance tests run against an in-process Kestrel server.
      - name: Tests
        run: dotnet test --no-build --verbosity normal

      - name: Format check
        run: dotnet format --verify-no-changes

      # Publishing with native AOT fails on any trim/AOT warning, in our packages or in the HTTP
      # libraries they pull in; running the binary then exercises a real request round trip
      # against an in-process server. See docs on Native AOT & trimming.
      - name: Native AOT smoke test
        run: |
          dotnet publish tests/Runax.Http.AotSmoke -c Release -o artifacts/aot-smoke
          ./artifacts/aot-smoke/Runax.Http.AotSmoke
